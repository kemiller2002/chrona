name: Lock readiness dependencies

on:
  push:
    branches:
      - "work/gh-4-readiness"
    paths:
      - ".github/workflows/readiness-dependencies.yml"

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "work/gh-4-readiness"
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve exact dependency lock
        run: npm install --package-lock-only --ignore-scripts=false
      - name: Commit lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Lock readiness dependencies"
          git push origin HEAD:"work/gh-4-readiness"
