name: Build

on:
  pull_request:
  push:
  # Started by the baseline workflow on the branch it opens a pull request
  # from, whose push alone starts nothing (visual-baselines.yml).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # A normal run takes about two minutes. Anything that stalls fails
    # here instead of holding a runner for the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The page loads Limen, Forma and Folio from node_modules, the
      # conformance tests read the installed packages, and the browser suite
      # needs its runner, so dependencies are installed before anything runs.
      - name: Install npm dependencies
        run: npm ci

      - name: Restore
        run: dotnet restore Chrona.sln

      # Warnings are errors (Directory.Build.props), so this also gates
      # warning regressions.
      - name: Build
        run: dotnet build Chrona.sln --no-restore --configuration Release

      # The slice engine (ported TypeScript tests), the Limen protocol and Aegis boundary, the
      # foundations conformance tests and the HTML/engine binding agreement.
      - name: Test
        run: dotnet test Chrona.sln --no-build --configuration Release --verbosity normal

      # The route inventory against Limen 0.9.0's echelon.routes/v1 schema
      # (CHX-460); PlacesTests holds it equal to the table's own rendering.
      - name: Validate the route inventory
        run: node --test tools/routes/inventory.test.mjs

      # The page's brand CSS must be Forma's own compiler output for
      # brand/chrona.brand.json at the pinned Forma release, never hand-edited.
      - name: Verify the Chrona brand is Forma's compiler output
        timeout-minutes: 5
        run: tools/brand/compile.sh --check

      - name: Verify the Limen boundary
        run: npm run check:limen

      # Publishing proves the engine still compiles to WebAssembly. It does
      # not prove the page works, which is what the browser suite is for.
      - name: Publish the WASM engine
        run: npm run build:wasm

      # Chromium used to be installed with `npx playwright install --with-deps
      # chromium`. `--with-deps` runs `sudo apt-get update` against the
      # runner's apt mirror list on every run, and apt has no overall
      # deadline: when the Azure Ubuntu mirror stopped answering, the update
      # stalled after the InRelease fetches and the step hung until the
      # six-hour job limit (signal#21, signal#22, summa#21). The runner image
      # already carries every shared library Chromium needs (apt reported each
      # one "already the newest version"), so the apt run bought nothing the
      # browser suite uses. The browser itself also re-downloaded on every
      # run. Now: the browser is cached under the exact Playwright version
      # pinned in package-lock.json (that version fixes the browser build),
      # and the OS libraries are proved present offline instead of being
      # fetched.
      - name: Resolve the pinned Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")" >> "$GITHUB_OUTPUT"

      # A stalled cache download falls back to a fresh browser download
      # after two minutes instead of the default ten.
      - name: Restore the Chromium build for that version
        id: chromium-cache
        uses: actions/cache@v4
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Download Chromium for the browser suite
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium

      # `ldd` proves offline that every shared library the Chromium binaries
      # link against is on the runner. Only when a future runner image drops
      # one does apt run at all, with per-request timeouts and retries and an
      # overall deadline, and the result is checked again. A missing library
      # fails the step by name; it can no longer hang.
      - name: Verify Chromium's OS libraries
        timeout-minutes: 8
        run: |
          missing_libraries() {
            find ~/.cache/ms-playwright -type f \( -name chrome -o -name chrome-headless-shell \) -print0 \
              | xargs -0 --no-run-if-empty ldd \
              | awk '/not found/ { print $1 }' \
              | sort -u
          }

          missing="$(missing_libraries)"
          if [ -n "$missing" ]; then
            echo "::warning::Runner image lacks Chromium libraries: $(echo $missing). Installing Chromium's OS dependencies."
            printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
              | sudo tee /etc/apt/apt.conf.d/99-bounded-network > /dev/null
            timeout 300 npx playwright install-deps chromium \
              || echo "::error::Installing Chromium's OS dependencies failed or took longer than five minutes."
          fi

          still_missing="$(missing_libraries)"
          if [ -n "$still_missing" ]; then
            echo "::error::Chromium cannot start; missing shared libraries: $(echo $still_missing)"
            exit 1
          fi
          echo "Every shared library Chromium links against is present."

      # The composed path: DOM event, Limen kernel, WASM shim, F# engine
      # and back, in a real browser, with Forma and Folio presenting it.
      - name: Verify the composed browser path
        run: npx playwright test

      # Every address opens cold on the published site too (CHX-460): the
      # Pages build, assembled as pages.yml assembles it, served as a static
      # host serves it, under the site's Content Security Policy.
      - name: Assemble the Pages site
        run: node tools/pages/assemble-site.mjs dist-pages

      - name: Open deep links on the Pages build
        run: npx playwright test -c playwright.pages.config.js

      # Each screen, light and dark, at desktop and phone width, against its
      # baseline (WI-0054). The baselines are this runner's renders with the
      # pinned Chromium; docs/legacy/visual-comparison.md says how to change one.
      - name: Compare the screens with their baselines
        run: npx playwright test -c playwright.visual.config.js

      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            tests/visual/baselines/
          retention-days: 7
