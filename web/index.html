<!doctype html>
<html lang="en" data-ef-brand="chrona">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Chrona records, corrects, reviews and reports business time." />
<meta name="theme-color" content="#215d57" />
<title>Chrona</title>
<!-- An empty icon: without it Chromium requests /favicon.ico, the static
     server answers 404, and that console error fails the no-errors check. -->
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<!-- Structure and presentation only. Every value below is projected by the F#
     engine (src/Chrona.Engine/App) through Limen's data-* bindings, and every
     control sends a named event back to it. Forma owns presentation (its
     components, and the Chrona brand's tokens: web/brand/); chrona.css lays
     out Chrona's own compositions on those tokens (the legacy look and feel,
     docs/legacy/). Nothing here decides anything. -->
<!-- A button, not a "#main" link: the fragment holds the page's address
     (CHX-460), so the skip link moves focus without changing it. -->
<button type="button" class="chrona-skip-link" data-event="skipToContent">Skip to content</button>

<!-- Transitions only (started, paused, saved): never the ticking timer. -->
<p class="ef-visually-hidden" role="status" aria-live="polite" data-text="announcement"></p>

<!-- Before anyone may work: reading the deployment's configuration, a
     configuration that cannot be used, or signing in (CHX-022). -->
<template data-if="screenConfiguring">
  <main class="chrona-gate" id="configuring" aria-busy="true">
    <p class="chrona-brand"><span class="chrona-brand__mark" aria-hidden="true">C</span><span class="chrona-brand__name">Chrona</span></p>
    <p class="chrona-intro">Opening Chrona…</p>
  </main>
</template>

<template data-if="screenMisconfigured">
  <main class="chrona-gate" id="misconfigured">
    <p class="chrona-brand"><span class="chrona-brand__mark" aria-hidden="true">C</span><span class="chrona-brand__name">Chrona</span></p>
    <h1 class="chrona-title">This deployment is not set up correctly.</h1>
    <p class="chrona-intro" role="alert" data-text="misconfiguredDetail"></p>
  </main>
</template>

<template data-if="screenSignIn">
  <div class="chrona-signin">
    <section class="chrona-signin__story" aria-label="Chrona">
      <p class="chrona-brand"><span class="chrona-brand__mark" aria-hidden="true">C</span><span class="chrona-brand__name">Chrona</span></p>
      <div class="chrona-signin__pitch">
        <p class="chrona-eyebrow">A record you can explain</p>
        <p class="chrona-signin__headline">Work, kept in context.</p>
        <p>Record the time, purpose, evidence, and history behind your business activity, without turning everyday work into paperwork.</p>
      </div>
      <p class="chrona-signin__footnote">Private business ledger · Echelon Foundry</p>
    </section>
    <main class="chrona-signin__panel" id="main" tabindex="-1">
      <form class="chrona-signin__form" id="sign-in" data-event="signIn" aria-labelledby="sign-in-title">
        <p class="chrona-eyebrow">Welcome back</p>
        <h1 class="chrona-title" id="sign-in-title">Sign in to your ledger</h1>
        <p class="chrona-intro">Chrona signs you in with your GitHub account. Your password never reaches Chrona, and your token is never written to your records.</p>
        <fieldset class="ef-choice-group chrona-signin__retention">
          <legend class="ef-choice-group__legend">Keep me signed in</legend>
          <label class="ef-choice">
            <input type="radio" name="retention" value="page" id="retention-page" data-event="signInRetention" data-bind-checked="retentionPage" />
            <span class="ef-choice__content"><strong>For this page only</strong><span>Reloading or closing the page signs you out.</span></span>
          </label>
          <label class="ef-choice">
            <input type="radio" name="retention" value="tab" id="retention-tab" data-event="signInRetention" data-bind-checked="retentionTab" />
            <span class="ef-choice__content"><strong>Until I close this tab</strong><span>Your token is kept in this tab's session storage.</span></span>
          </label>
        </fieldset>
        <button type="submit" class="chrona-action chrona-action--primary chrona-action--full" id="sign-in-button" data-bind-disabled="signInBusy" data-text="signInButton"></button>
        <template data-if="hasSignInNotice">
          <p class="chrona-signin__notice" id="sign-in-notice" role="status" data-bind-data-code="signInNoticeCode" data-text="signInNotice"></p>
        </template>
        <p class="chrona-signin__footnote">By continuing, you are opening a private business record. Sign out when using a shared device.</p>
      </form>
    </main>
  </div>
</template>

<template data-if="screenOpening">
  <main class="chrona-gate" id="opening" aria-busy="true">
    <p class="chrona-brand"><span class="chrona-brand__mark" aria-hidden="true">C</span><span class="chrona-brand__name">Chrona</span></p>
    <p class="chrona-intro">Opening your records…</p>
  </main>
</template>

<template data-if="screenStoreFailed">
  <main class="chrona-gate" id="store-failed">
    <p class="chrona-brand"><span class="chrona-brand__mark" aria-hidden="true">C</span><span class="chrona-brand__name">Chrona</span></p>
    <h1 class="chrona-title">Your records could not be opened.</h1>
    <p class="chrona-intro" role="alert" id="store-failure" data-text="storeFailure"></p>
    <p class="chrona-intro" id="offline-waiting" data-text="offlineWaiting"></p>
    <template data-if="hasQueueNotice">
      <p class="chrona-intro" role="status" id="store-failed-queue-notice" data-text="queueNotice"></p>
    </template>
    <template data-if="offlineTimer">
      <section class="ef-surface chrona-card" aria-labelledby="offline-timer-title" id="offline-timer">
        <h2 class="chrona-section-title" id="offline-timer-title" tabindex="-1">Your timer on this device</h2>
        <p class="chrona-intro"><span data-text="timerStateText"></span> · <strong role="timer" aria-live="off" data-text="timerElapsed"></strong></p>
        <p class="chrona-intro" data-text="offlineStoppedText"></p>
        <div class="chrona-conflicts__actions">
          <button type="button" class="chrona-action chrona-action--secondary" id="offline-pause" data-event="pauseTimer" data-bind-hidden="timerPaused" data-bind-disabled="timerIdle">Pause</button>
          <button type="button" class="chrona-action chrona-action--secondary" id="offline-resume" data-event="resumeTimer" data-bind-hidden="timerRunning" data-bind-disabled="timerIdle">Resume</button>
          <button type="button" class="chrona-action chrona-action--primary" data-event="stopTimer" data-bind-disabled="timerIdle">Stop and hold the time</button>
        </div>
      </section>
    </template>
    <button type="button" class="chrona-action chrona-action--primary" id="retry-store" data-event="retryStore">Try again</button>
  </main>
</template>

<template data-if="screenConfirmAdministrator">
  <main class="chrona-gate" id="confirm-administrator">
    <p class="chrona-brand"><span class="chrona-brand__mark" aria-hidden="true">C</span><span class="chrona-brand__name">Chrona</span></p>
    <h1 class="chrona-title">This organization needs its administrator.</h1>
    <p class="chrona-intro" id="confirmation-detail" data-text="confirmationDetail"></p>
    <template data-if="canConfirmAdministrator">
      <button type="button" class="chrona-action chrona-action--primary" id="confirm-administrator-button" data-event="confirmAdministrator">Confirm me as administrator</button>
    </template>
    <button type="button" class="chrona-action chrona-action--secondary" data-event="signOut">Sign out</button>
  </main>
</template>

<template data-if="screenNotMember">
  <main class="chrona-gate" id="not-member">
    <p class="chrona-brand"><span class="chrona-brand__mark" aria-hidden="true">C</span><span class="chrona-brand__name">Chrona</span></p>
    <h1 class="chrona-title">You are not a member here yet.</h1>
    <p class="chrona-intro" id="not-member-detail" data-text="notMemberDetail"></p>
    <button type="button" class="chrona-action chrona-action--secondary" id="not-member-sign-out" data-event="signOut">Sign out</button>
  </main>
</template>

<template data-if="shellVisible">
<div class="chrona-shell">
  <aside class="chrona-sidebar" aria-label="Chrona">
    <p class="chrona-brand"><span class="chrona-brand__mark" aria-hidden="true">C</span><span class="chrona-brand__name">Chrona</span></p>
    <nav class="chrona-nav" aria-label="Primary">
      <template data-each="navigation" data-key="id">
        <a class="chrona-nav__link" data-bind-href="href" data-bind-aria-current="current"><span class="chrona-nav__mark" aria-hidden="true" data-text="mark"></span><span data-text="label"></span></a>
      </template>
    </nav>
    <div class="chrona-sidebar__status" data-bind-data-state="storeTone">
      <p class="chrona-status"><span class="chrona-status__dot" aria-hidden="true"></span><strong data-text="storeHeadline"></strong></p>
      <p class="chrona-sidebar__meta" data-text="storeDetail"></p>
    </div>
  </aside>

  <main class="chrona-page" id="main" tabindex="-1">
    <template data-if="shellUpdate">
      <aside class="ef-alert chrona-notice" role="status" data-tone="info" id="shell-update">
        <div class="ef-alert__icon" aria-hidden="true">i</div>
        <div class="chrona-stack">
          <p class="ef-alert__title">A newer Chrona is ready.</p>
          <p data-text="shellUpdateText"></p>
          <button type="button" class="chrona-action chrona-action--secondary" id="reload-shell" data-event="reloadShell" data-bind-disabled="shellReloadBlocked">Reload now</button>
        </div>
      </aside>
    </template>
    <template data-if="queueElsewhere">
      <aside class="ef-alert chrona-notice" role="status" data-tone="info" id="queue-elsewhere">
        <div class="ef-alert__icon" aria-hidden="true">i</div>
        <div class="chrona-stack">
          <p class="ef-alert__title">Another tab is holding your unsent changes.</p>
          <p>Changes made in this tab are sent from it while GitHub can be reached; keep it open until they are. Use this tab instead to have it keep and send them all; the other tab then stops. Nothing is sent twice.</p>
          <button type="button" class="chrona-action chrona-action--secondary" id="take-over-queue" data-event="takeOverQueue" data-bind-hidden="queueWaiting">Use this tab instead</button>
          <template data-if="queueWaiting">
            <p id="queue-waiting">Taking them over from the other tab…</p>
          </template>
        </div>
      </aside>
    </template>
    <!-- LCP-065: said before a change is made offline, not after. -->
    <template data-if="offlineInPage">
      <aside class="ef-alert chrona-notice" role="status" data-tone="attention" id="offline-in-page">
        <div class="ef-alert__icon" aria-hidden="true">!</div>
        <div class="chrona-stack">
          <p class="ef-alert__title">Changes made now stay in this page only.</p>
          <p>GitHub cannot be reached and this browser keeps nothing for this tab. Keep this page open until they are sent: closing it loses them.</p>
        </div>
      </aside>
    </template>
    <template data-if="hasQueueNotice">
      <aside class="ef-alert chrona-notice" role="status" data-tone="info" id="queue-notice">
        <div class="ef-alert__icon" aria-hidden="true">i</div>
        <p data-text="queueNotice"></p>
      </aside>
    </template>
    <!-- Unexpected operational failure (Aegis) is its own presentation. A
         refused entry is an ordinary problem beside its form. -->
    <template data-if="hasOperationalFault">
      <ef-fault-inline class="ef-component-tag">
        <div class="ef-fault ef-fault--inline" id="operational-fault"
             data-ef-intent="inline" data-ef-severity="error" role="alert"
             aria-labelledby="operational-fault-title">
          <div class="ef-fault__marker" aria-hidden="true">!</div>
          <div class="ef-fault__body">
            <p class="ef-fault__severity">Operational error</p>
            <p class="ef-fault__title" id="operational-fault-title"><strong data-text="operationalFaultTitle"></strong></p>
            <p class="ef-fault__message" data-text="operationalFaultMessage"></p>
            <p class="ef-fault-reference">Reference <code data-text="operationalFaultReference"></code></p>
          </div>
        </div>
      </ef-fault-inline>
    </template>

    <template data-if="hasSessionNotice">
      <p class="chrona-session-notice" id="session-notice" role="status" data-bind-data-code="signInNoticeCode" data-text="signInNotice"></p>
    </template>

    <header class="chrona-topbar">
      <p class="chrona-eyebrow" data-text="todayLong"></p>
      <div class="chrona-topbar__actions">
        <template data-if="showTimerChip">
          <button type="button" class="chrona-timer-chip" data-event="goTrack" id="timer-chip">
            <span class="chrona-timer-chip__activity"><strong data-text="timerChipTitle"></strong><span data-text="timerStateText"></span></span>
            <span class="chrona-timer-chip__time" data-text="timerElapsed"></span>
          </button>
        </template>
        <template data-if="canCopyLink">
          <button type="button" class="chrona-action chrona-action--quiet" id="copy-link" data-event="copyLink">Copy link</button>
        </template>
        <span class="chrona-identity" role="img" data-bind-aria-label="sessionName" data-text="sessionInitials"></span>
      </div>
    </header>

    <!-- "Copy link" (CHX-460): what happened, and the link to select by hand
         when the browser would not copy it. The live region says it once. -->
    <template data-if="hasLinkStatus">
      <div class="chrona-link-status" id="link-status">
        <p data-text="linkStatus"></p>
        <template data-if="linkRefused">
          <label class="ef-field"><span class="ef-field__label">Link to this view</span>
            <input class="ef-input" type="text" id="link-text" readonly data-bind-value="linkText" />
          </label>
        </template>
      </div>
    </template>

    <!-- ======================= Not found, not permitted ======================= -->
    <template data-if="screenProblem">
      <section class="chrona-screen" id="screen-problem" aria-labelledby="problem-title" data-bind-data-kind="problemKind">
        <div class="ef-empty-state chrona-empty">
          <div class="ef-empty-state__symbol" aria-hidden="true">?</div>
          <h1 class="chrona-title" id="problem-title" data-text="problemTitle"></h1>
          <p id="problem-detail" data-text="problemDetail"></p>
          <a class="chrona-action chrona-action--primary" id="problem-home" href="#/">Go to today</a>
        </div>
      </section>
    </template>

    <!-- ======================= Today ======================= -->
    <template data-if="screenToday">
      <section class="chrona-screen" id="screen-today" aria-labelledby="today-title">
        <div class="chrona-heading">
          <p class="chrona-eyebrow" data-text="dayEyebrow"></p>
          <h1 class="chrona-title" id="today-title" data-text="dayTitle"></h1>
          <p class="chrona-intro">Effective records lead. A voided record stays on the day, out of the totals.</p>
        </div>

        <div class="chrona-day-nav">
          <button type="button" class="chrona-action chrona-action--quiet" data-event="previousDay" aria-label="Previous day"><span aria-hidden="true">←</span></button>
          <label class="chrona-day-nav__date"><span class="ef-visually-hidden">Jump to date</span>
            <input type="date" id="day-picker" data-event="showDate" data-bind-value="dayIso" />
          </label>
          <button type="button" class="chrona-action chrona-action--quiet" data-event="nextDay" aria-label="Next day"><span aria-hidden="true">→</span></button>
          <button type="button" class="chrona-action chrona-action--quiet" data-event="goToday">Today</button>
          <a class="chrona-action chrona-action--quiet" id="day-week" data-bind-href="weekHref">Week</a>
        </div>

        <!-- The ledger's project filter lives in the address (CHX-460). -->
        <label class="ef-select-field chrona-day-filter">
          <span class="ef-field__label">Project</span>
          <span class="ef-select">
            <select class="ef-select__input" id="day-project" data-event="dayProject">
              <template data-each="dayProjectOptions" data-key="id"><option data-bind-value="id" data-bind-selected="selected" data-text="name"></option></template>
            </select>
            <span class="ef-select__indicator" aria-hidden="true"></span>
          </span>
        </label>

        <div class="chrona-layout">
          <section class="ef-surface chrona-card" aria-labelledby="ledger-title">
            <div class="chrona-day-summary">
              <div>
                <p class="chrona-summary-label" id="ledger-title">Recorded work</p>
                <p class="chrona-summary-value" id="day-total" data-text="dayTotal"></p>
              </div>
              <p class="chrona-summary-count"><span data-text="dayEntryCount"></span> · <span data-text="dayBilled"></span> · <span data-text="dayDecimal"></span></p>
            </div>

            <template data-if="dayFilteredEmpty">
              <div class="ef-empty-state chrona-empty" id="day-filtered-empty">
                <div class="ef-empty-state__symbol" aria-hidden="true">□</div>
                <h2>No time for <span data-text="dayFilterName"></span> on this day.</h2>
                <p>Choose "All projects" to see the whole day.</p>
              </div>
            </template>

            <template data-if="dayEmpty">
              <div class="ef-empty-state chrona-empty">
                <div class="ef-empty-state__symbol" aria-hidden="true">□</div>
                <h2>No activity recorded yet.</h2>
                <p>Start a timer or add work you already completed.</p>
                <button type="button" class="chrona-action chrona-action--primary" data-event="goTrack">Start tracking</button>
              </div>
            </template>

            <ol class="chrona-timeline" id="day-records" aria-label="Activities">
              <template data-each="dayRecords" data-key="id">
                <li class="chrona-record" data-bind-data-voided="voided">
                  <p class="chrona-record__time"><span data-text="start"></span><span data-text="finish"></span></p>
                  <div class="chrona-record__body">
                    <div class="chrona-record__head">
                      <h2 class="chrona-record__title"><a class="chrona-link" data-bind-href="href" data-text="title"></a></h2>
                      <span class="chrona-record__duration" data-text="duration"></span>
                    </div>
                    <p class="chrona-record__classification" data-text="classification"></p>
                    <p class="chrona-record__purpose" data-text="purpose"></p>
                    <p class="chrona-record__meta">
                      <span class="ef-status-lozenge" data-state="ok" data-text="method"></span>
                      <span class="ef-status-lozenge" data-bind-data-state="stateTone" data-text="state"></span>
                      <span class="chrona-record__billed" data-text="billed"></span>
                    </p>
                    <label class="ef-checkbox chrona-record__select"><input class="ef-checkbox__input" type="checkbox" data-event="mergeSelect" data-bind-checked="mergeSelected" /><span class="ef-checkbox__box" aria-hidden="true"></span><span class="ef-checkbox__text"><span class="ef-checkbox__label">Select to merge</span></span></label>
                  </div>
                </li>
              </template>
            </ol>
          </section>

          <aside class="chrona-stack" aria-label="Day status">
            <section class="ef-surface chrona-card" aria-labelledby="day-status-title">
              <h2 class="chrona-section-title" id="day-status-title">Day status</h2>
              <dl class="ef-facts chrona-facts">
                <div class="ef-facts__item"><dt>Timer entries</dt><dd data-text="dayTimerTotal"></dd></div>
                <div class="ef-facts__item"><dt>Manual entries</dt><dd data-text="dayManualTotal"></dd></div>
                <div class="ef-facts__item"><dt>Corrections</dt><dd data-text="dayCorrections"></dd></div>
                <div class="ef-facts__item"><dt>Voided</dt><dd data-text="dayVoided"></dd></div>
                <div class="ef-facts__item"><dt>Evidence coverage</dt><dd data-text="dayEvidence"></dd></div>
              </dl>
            </section>
            <section class="ef-surface chrona-card" aria-labelledby="period-title" id="period">
              <h2 class="chrona-section-title" id="period-title">This period</h2>
              <p class="chrona-intro" id="period-label" data-text="periodLabel"></p>
              <a class="chrona-link" id="open-period" data-bind-href="periodHref">Open the period</a>
              <dl class="ef-facts chrona-facts">
                <div class="ef-facts__item"><dt>Exact</dt><dd id="period-exact" data-text="periodExact"></dd></div>
                <div class="ef-facts__item"><dt>Billable, as billed</dt><dd data-text="periodBillable"></dd></div>
                <div class="ef-facts__item"><dt>Non-billable</dt><dd data-text="periodNonBillable"></dd></div>
                <div class="ef-facts__item"><dt>Unclassified</dt><dd data-text="periodUnclassified"></dd></div>
                <div class="ef-facts__item"><dt>Submission</dt><dd data-text="periodSubmission"></dd></div>
                <div class="ef-facts__item"><dt>Approval</dt><dd data-text="periodApproval"></dd></div>
              </dl>
            </section>
            <button type="button" class="chrona-action chrona-action--primary chrona-action--full" id="open-review" data-event="openReview">Review this day</button>
            <button type="button" class="chrona-action chrona-action--secondary chrona-action--full" data-event="goTrack">Add time</button>

            <template data-if="hasObligations">
              <section class="ef-alert chrona-obligations" data-tone="attention" aria-labelledby="obligations-title" id="obligations">
                <div class="ef-alert__icon" aria-hidden="true">!</div>
                <div>
                  <h2 class="ef-alert__title" id="obligations-title">Needs attention</h2>
                  <ul class="chrona-obligations__list">
                    <template data-each="obligations" data-key="id">
                      <li><p><strong data-text="title"></strong></p><p data-text="detail"></p><button type="button" class="chrona-action chrona-action--secondary" data-event="resolveObligation" data-text="action"></button></li>
                    </template>
                  </ul>
                </div>
              </section>
            </template>

            <template data-if="canMerge">
              <form class="ef-surface chrona-card" id="merge" data-event="saveMerge" aria-labelledby="merge-title">
                <h2 class="chrona-section-title" id="merge-title">Merge selected activities</h2>
                <p class="chrona-intro" data-text="mergeCount"></p>
                <p class="chrona-intro">Only adjacent activities on one day merge. The merged record keeps every original, superseded.</p>
                <div class="chrona-form-grid chrona-form-grid--single">
                  <label class="ef-select-field">
                    <span class="ef-field__label">Activity type</span>
                    <span class="ef-select">
                      <select class="ef-select__input" id="merge-activity-type" data-event="mergeActivityType">
                        <option value="" data-bind-selected="mergeTypeUnset">Keep the first one's</option>
                        <template data-each="mergeTypeOptions" data-key="id"><option data-bind-value="id" data-bind-selected="selected" data-text="name"></option></template>
                      </select>
                      <span class="ef-select__indicator" aria-hidden="true"></span>
                    </span>
                  </label>
                  <label class="ef-select-field">
                    <span class="ef-field__label">Project</span>
                    <span class="ef-select">
                      <select class="ef-select__input" id="merge-project" data-event="mergeProject">
                        <option value="" data-bind-selected="mergeProjectUnset">Keep the first one's</option>
                        <template data-each="mergeProjectOptions" data-key="id"><option data-bind-value="id" data-bind-selected="selected" data-text="name"></option></template>
                      </select>
                      <span class="ef-select__indicator" aria-hidden="true"></span>
                    </span>
                  </label>
                  <div class="ef-field">
                    <label class="ef-field__label" for="merge-description">Description</label>
                    <input id="merge-description" type="text" data-event="mergeDescription" data-on="input" data-bind-value="mergeDescription" />
                  </div>
                  <div class="ef-field">
                    <label class="ef-field__label" for="merge-purpose">Business purpose</label>
                    <input id="merge-purpose" type="text" data-event="mergePurpose" data-on="input" data-bind-value="mergePurpose" />
                  </div>
                </div>
                <template data-if="hasMergeProblems">
                  <div class="ef-alert chrona-notice" role="alert" data-tone="attention" id="merge-problems">
                    <div class="ef-alert__icon" aria-hidden="true">!</div>
                    <div>
                      <p class="ef-alert__title">These were not merged.</p>
                      <ul class="chrona-problems"><template data-each="mergeProblems" data-key="id"><li data-bind-data-code="code" data-text="text"></li></template></ul>
                    </div>
                  </div>
                </template>
                <div class="chrona-form-actions">

                  <div>
                    <p class="ef-alert__title">That was not done.</p>
                    <ul class="chrona-problems"><template data-each="periodProblems" data-key="id"><li data-bind-data-code="code" data-text="text"></li></template></ul>
                  </div>
                </div>
              </template>
            </section>

            <template data-if="hasConflicts">
              <section class="ef-surface chrona-card" aria-labelledby="conflicts-title" id="conflicts">
                <h2 class="chrona-section-title" id="conflicts-title">Changes not saved</h2>
                <p class="chrona-intro">These changed elsewhere before yours were saved. Nothing of yours was discarded: decide what happens to each.</p>
                <ul class="chrona-conflicts">
                  <template data-each="conflicts" data-key="id">
                    <li class="chrona-conflicts__item" data-bind-data-code="code">
                      <p><strong data-text="title"></strong></p>
                      <p class="chrona-intro" data-text="detail"></p>
                      <p class="chrona-conflicts__code" data-text="code"></p>
                      <div class="chrona-conflicts__actions">
                        <button type="button" class="chrona-action chrona-action--primary" data-event="redoChange" data-bind-hidden="noRedo" data-text="redoLabel"></button>
                        <button type="button" class="chrona-action chrona-action--primary" data-event="retryChange" data-bind-hidden="noRetry">Try again</button>
                        <button type="button" class="chrona-action chrona-action--secondary" data-event="keepStored">Keep what is stored</button>
                      </div>
                    </li>
                  </template>
                </ul>
                <template data-if="hasConflictProblems">
                  <ul class="chrona-problems" role="alert" id="conflict-problems"><template data-each="conflictProblems" data-key="id"><li data-bind-data-code="code" data-text="text"></li></template></ul>
                </template>
              </section>
            </template>

            <template data-if="hasOutsideEdits">
              <section class="ef-surface chrona-card" aria-labelledby="outside-edits-title" id="outside-edits">
                <h2 class="chrona-section-title" id="outside-edits-title">Changed outside Chrona</h2>
                <p class="chrona-intro">These records of yours were edited in the repository, not in Chrona. They are held, and count for nothing, until you review them. Accepting one checks it like any entry you record.</p>
                <ul class="chrona-conflicts">
                  <template data-each="outsideEdits" data-key="id">
                    <li class="chrona-conflicts__item">
                      <p><strong data-text="title"></strong></p>
                      <p class="chrona-intro" data-text="detail"></p>
                      <div class="chrona-conflicts__actions">
                        <button type="button" class="chrona-action chrona-action--secondary" data-event="acceptOutsideEdit">Accept this version</button>
                      </div>
                    </li>
                  </template>
                </ul>
                <template data-if="hasOutsideEditProblems">
                  <div class="ef-alert chrona-notice" role="alert" data-tone="attention" id="outside-edit-problems">
                    <div class="ef-alert__icon" aria-hidden="true">!</div>
                    <div>
                      <p class="ef-alert__title">That record was not accepted.</p>
                      <ul class="chrona-problems"><template data-each="outsideEditProblems" data-key="id"><li data-bind-data-code="code" data-text="text"></li></template></ul>
                    </div>
                  </div>
                </template>
              </section>
            </template>

            <section class="ef-surface chrona-card" aria-labelledby="session-title">
              <h2 class="chrona-section-title" id="session-title">This session</h2>
              <dl class="ef-facts chrona-facts">
                <div class="ef-facts__item"><dt>Working as</dt><dd data-text="sessionName"></dd></div>
                <div class="ef-facts__item"><dt>Time zone</dt><dd id="zone" data-text="zoneId"></dd></div>
                <div class="ef-facts__item"><dt>Records</dt><dd data-text="storeHeadline"></dd></div>
                <div class="ef-facts__item"><dt>Unsent changes</dt><dd id="queue-mode" data-text="queueMode"></dd></div>
              </dl>
              <p class="chrona-intro" data-text="storeDetail"></p>
              <template data-if="accountSignedIn">
                <div class="chrona-account" id="account">
                  <p class="chrona-intro">Signed in with <span data-text="accountProvider"></span> as <strong id="account-login" data-text="accountLogin"></strong>. <span data-text="accountRetention"></span></p>
                  <button type="button" class="chrona-action chrona-action--secondary" id="sign-out" data-event="signOut">Sign out and clear the token</button>
                  <template data-if="signOutChoosing">
                    <div class="ef-alert chrona-notice" role="alertdialog" aria-labelledby="sign-out-title" data-tone="attention" id="sign-out-choice">
                      <div class="ef-alert__icon" aria-hidden="true">!</div>
                      <div class="chrona-stack">
                        <p class="ef-alert__title" id="sign-out-title" data-text="signOutSummary"></p>
                        <p class="chrona-intro" data-text="signOutNote"></p>
                        <div class="chrona-conflicts__actions">
                          <button type="button" class="chrona-action chrona-action--primary" id="sign-out-send" data-event="signOutSend" data-bind-disabled="signOutCannotSend">Send them now, then sign out</button>
                          <button type="button" class="chrona-action chrona-action--secondary" id="sign-out-keep" data-event="signOutKeep" data-bind-hidden="signOutCannotKeep">Keep them on this device for this account</button>
                          <button type="button" class="chrona-action chrona-action--secondary" id="sign-out-discard" data-event="signOutDiscard">Discard them</button>
                          <button type="button" class="chrona-link" data-event="signOutCancel">Stay signed in</button>
                        </div>
                      </div>
                    </div>
                  </template>
                  <template data-if="signOutSending">
                    <p class="chrona-intro" role="status" id="sign-out-sending">Sending your changes; you will be signed out once they are stored…</p>
                  </template>
                  <template data-if="signOutConfirming">
                    <div class="ef-alert chrona-notice" role="alertdialog" aria-labelledby="sign-out-confirm-title" data-tone="attention" id="sign-out-confirm">
                      <div class="ef-alert__icon" aria-hidden="true">!</div>
                      <div class="chrona-stack">
                        <p class="ef-alert__title" id="sign-out-confirm-title" data-text="signOutDiscardText"></p>
                        <div class="chrona-conflicts__actions">
                          <button type="button" class="chrona-action chrona-action--primary" id="sign-out-discard-confirm" data-event="signOutDiscardConfirmed">Discard and sign out</button>
                          <button type="button" class="chrona-link" data-event="signOutCancel">Keep them and stay signed in</button>
                        </div>
                      </div>
                    </div>
                  </template>
                  <template data-if="signOutDiscarding">
                    <p class="chrona-intro" role="status">Discarding…</p>
                  </template>
                  <!-- WI-0057, LCP-070, LCP-086: nothing of this account's is unsent. -->
                  <template data-if="canClearDevice">
                    <button type="button" class="chrona-action chrona-action--secondary" id="clear-device" data-event="clearDevice">Clear this device</button>
                  </template>
                  <template data-if="clearDeviceConfirming">
                    <div class="ef-alert chrona-notice" role="alertdialog" aria-labelledby="clear-device-title" data-tone="attention" id="clear-device-confirm">
                      <div class="ef-alert__icon" aria-hidden="true">!</div>
                      <div class="chrona-stack">
                        <p class="ef-alert__title" id="clear-device-title">Clear Chrona's data from this browser and sign out?</p>
                        <p class="chrona-intro">What this browser keeps to open your records offline is removed, for every account who signed in here. Your records on GitHub are untouched. Close Chrona's other tabs first.</p>
                        <div class="chrona-conflicts__actions">
                          <button type="button" class="chrona-action chrona-action--primary" id="clear-device-confirmed" data-event="clearDeviceConfirmed">Clear and sign out</button>
                          <button type="button" class="chrona-link" data-event="clearDeviceCancel">Keep them</button>
                        </div>
                      </div>
                    </div>
                  </template>
                  <template data-if="clearDeviceClearing">
                    <p class="chrona-intro" role="status" id="clear-device-clearing">Clearing this browser…</p>
                  </template>
                  <template data-if="hasDeviceNote">
                    <p class="chrona-intro" role="alert" id="device-note" data-text="deviceNote"></p>
                  </template>
                </div>
              </template>
              <template data-if="hasStoreProblems">
                <div class="ef-alert chrona-notice" role="alert" data-tone="attention" id="store-problems">
                  <div class="ef-alert__icon" aria-hidden="true">!</div>
                  <div>
                    <p class="ef-alert__title" data-text="storeProblemSummary"></p>
                    <ul class="chrona-problems"><template data-each="storeProblems" data-key="id"><li data-bind-data-code="code" data-text="text"></li></template></ul>
                  </div>
                </div>
              </template>
              <template data-if="canChooseOrganization">
                <label class="ef-select-field" id="organization-choice">
                  <span class="ef-field__label">Organization</span>
                  <span class="ef-select">
                    <select class="ef-select__input" id="organization" data-event="chooseOrganization">
                      <template data-each="organizationOptions" data-key="id"><option data-bind-value="id" data-bind-selected="selected" data-text="name"></option></template>
                    </select>
                    <span class="ef-select__indicator" aria-hidden="true"></span>
                  </span>
                </label>
              </template>
              <div class="chrona-access" id="access">
                <p class="chrona-intro">In <strong data-text="organizationName"></strong> you can:</p>
                <ul class="chrona-access__list"><template data-each="accessCapabilities" data-key="id"><li data-bind-data-capability="id" data-text="name"></li></template></ul>
              </div>
              <template data-if="accountLocal">
                <p class="chrona-intro" id="account-local">This deployment has no sign-in: you are working in a local session in this browser tab.</p>
              </template>
            </section>

            <template data-if="canManageMembers">
              <section class="ef-surface chrona-card" aria-labelledby="people-title" id="people">
                <h2 class="chrona-section-title" id="people-title">People</h2>
                <p class="chrona-intro">Who works in <span data-text="organizationName"></span>, and what each may do. Everyone signs in with GitHub.</p>
                <ul class="chrona-members" id="members">
                  <template data-each="members" data-key="id">
                    <li class="chrona-members__item">
                      <p><strong data-text="name"></strong> <span class="chrona-members__account">GitHub account <span data-text="account"></span></span></p>
                      <span class="ef-select">
                        <select class="ef-select__input" aria-label="Access" data-event="changeMemberAccess" data-bind-value="access">
                          <option value="ownTime">Keeps their own time</option>
                          <option value="reviewer">Reviews the organization's time</option>
                          <option value="administrator">Administers the organization</option>
                          <option value="custom" disabled>Custom</option>
                        </select>
                        <span class="ef-select__indicator" aria-hidden="true"></span>
                      </span>
                      <button type="button" class="chrona-link" data-event="removeMember">Remove</button>
                    </li>
                  </template>
                </ul>
                <form class="chrona-stack" id="admit-member" data-event="admitMember" aria-label="Add a member">
                  <div class="ef-field">
                    <label class="ef-field__label" for="member-id">GitHub account number <span aria-hidden="true">*</span></label>
                    <input id="member-id" type="text" inputmode="numeric" aria-required="true" data-event="memberId" data-on="input" data-bind-value="memberId" />
                  </div>
                  <div class="ef-field">
                    <label class="ef-field__label" for="member-name">Name <span aria-hidden="true">*</span></label>
                    <input id="member-name" type="text" aria-required="true" data-event="memberName" data-on="input" data-bind-value="memberName" />
                  </div>
                  <label class="ef-select-field">
                    <span class="ef-field__label">Access</span>
                    <span class="ef-select">
                      <select class="ef-select__input" id="member-access" data-event="memberAccess" data-bind-value="memberAccess">
                        <option value="ownTime">Keeps their own time</option>
                        <option value="reviewer">Reviews the organization's time</option>
                        <option value="administrator">Administers the organization</option>
                      </select>
                      <span class="ef-select__indicator" aria-hidden="true"></span>
                    </span>
                  </label>
                  <template data-if="hasMemberProblems">
                    <ul class="chrona-problems" role="alert" id="member-problems"><template data-each="memberProblems" data-key="id"><li data-bind-data-code="code" data-text="text"></li></template></ul>
                  </template>
                  <button type="submit" class="chrona-action chrona-action--secondary" id="admit">Add member</button>
                </form>
              </section>
            </template>

            <template data-if="canRebuildIndex">
              <section class="ef-surface chrona-card" aria-labelledby="index-title" id="activity-index">
                <h2 class="chrona-section-title" id="index-title">Activity index</h2>
                <p class="chrona-intro">Derived from the records, never a record itself: it lists every month that holds time, so history needs one read. Rebuilding it reads every record in the organization.</p>
                <p class="chrona-intro" id="index-status" data-text="indexStatus"></p>
                <template data-if="hasIndexProblems">
                  <ul class="chrona-problems" role="alert"><template data-each="indexProblems" data-key="id"><li data-bind-data-code="code" data-text="text"></li></template></ul>
                </template>
                <button type="button" class="chrona-action chrona-action--secondary" id="rebuild-index" data-event="rebuildIndex">Rebuild from the records</button>
              </section>
            </template>

            <!-- WI-0038: what reading producers' inboxes found (requirement 18):
                 only where the deployment keeps records on GitHub. -->
            <template data-if="hasInboxes">
            <section class="ef-surface chrona-card" aria-labelledby="inbox-title" id="inbox">
              <h2 class="chrona-section-title" id="inbox-title">Observation inboxes</h2>
              <p class="chrona-intro">Other systems put observations of your work in the organization's inbox folder. Each becomes a candidate you accept as your time or reject. <a class="chrona-link" id="inbox-candidates" data-bind-href="inboxCandidatesHref">See the candidates</a>.</p>
              <p class="chrona-intro" role="status" id="inbox-status" data-text="inboxSummary"></p>
              <template data-if="hasInboxInvalid">
                <div>
                  <h3 class="chrona-subtitle">Not observations</h3>
                  <ul class="chrona-conflicts" id="inbox-invalid">
                    <template data-each="inboxInvalid" data-key="id">
                      <li class="chrona-conflicts__item"><p><code data-text="file"></code></p><p data-text="reasons"></p></li>
                    </template>
                  </ul>
                </div>
              </template>
              <template data-if="canReadInboxes">
                <button type="button" class="chrona-action chrona-action--secondary" id="read-inboxes" data-event="readInboxes">Read the inboxes now</button>
              </template>
            </section>
            </template>
          </aside>
        </div>
        <footer class="chrona-footer">Chrona preserves original records and records later changes separately.</footer>
      </section>
    </template>
  </main>
</div>
</template>

<template data-if="screenReports">
  <!-- Folio's print surface: the same report as a document. It adds no
       meaning; on screen the interactive report is the presentation. -->
  <ef-print-document class="chrona-print">
    <ef-print-header>
      <header>
        <p>Chrona</p>
        <h1 data-text="printTitle"></h1>
        <p data-text="printSubtitle"></p>
        <p data-text="printGenerated"></p>
      </header>
    </ef-print-header>
    <ef-print-section>
      <section>
        <h2>Totals</h2>
        <ef-print-table>
          <table>
            <thead><tr><th scope="col">Measure</th><th scope="col">Time</th></tr></thead>
            <tbody>
              <tr><td>Exact recorded</td><td data-text="reportExact"></td></tr>
              <tr><td>Billable, as billed</td><td data-text="reportBillable"></td></tr>
              <tr><td>Non-billable</td><td data-text="reportNonBillable"></td></tr>
            </tbody>
          </table>
        </ef-print-table>
      </section>
    </ef-print-section>
    <ef-print-section>
      <section>
        <h2>Activities</h2>
        <ef-print-table>
          <table>
            <thead><tr><th scope="col">Date</th><th scope="col">Activity</th><th scope="col">Exact</th><th scope="col">Billed</th></tr></thead>
            <tbody>
              <template data-each="reportRows" data-key="id">
                <tr><td data-text="date"></td><td data-text="title"></td><td data-text="exact"></td><td data-text="billed"></td></tr>
              </template>
            </tbody>
          </table>
        </ef-print-table>
      </section>
    </ef-print-section>
    <ef-print-footer>
      <footer><span>Chrona time report · <span data-text="reportRange"></span></span><ef-print-page-number></ef-print-page-number></footer>
    </ef-print-footer>
  </ef-print-document>
</template>

<nav class="chrona-tabbar" aria-label="Primary">
  <template data-each="navigation" data-key="id">
    <a class="chrona-tabbar__link" data-bind-href="href" data-bind-aria-current="current"><span class="chrona-tabbar__mark" aria-hidden="true" data-text="mark"></span><span data-text="label"></span></a>
  </template>
</nav>
<script type="module" src="./app.js"></script>
</body>
</html>
