name: Readiness lifecycle convergence

on:
  push:
    branches:
      - "work/gh-4-readiness"

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "work/gh-4-readiness"
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Converge lifecycle tools
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package=@echelon-foundry/repository-operating-system@3.1.4 ros upgrade
          npx --yes --package=@echelon-foundry/repository-operating-system@3.1.4 ros verify
          npx --yes @echelon-foundry/sde@1.3.0 verify
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.2 upgrade
          npx --yes @echelon-foundry/typescript-wasm-kernel@0.6.2 verify --strict
      - name: Commit lifecycle convergence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .echelon .ros .sde .github/workflows/ros-validation.yml .github/workflows/limen-verify.yml ros ros.json limen.config.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No lifecycle changes"
            exit 0
          fi
          git commit -m "Converge application readiness lifecycle"
          git push origin HEAD:"work/gh-4-readiness"
